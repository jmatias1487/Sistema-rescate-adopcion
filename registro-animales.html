<!DOCTYPE html> 
<html lang="es"> 
  <head> 
    <meta charset="UTF-8"> 
    <title>Registrar Animal</title> 
  </head> 
  <body> 
    <header> 
      <h1>Registrar Animal Rescatado</h1> 
    </nav> 
    </header> 

    <main>
      <h2>Formulario de registro</h2> 
      <form>
        <label>Nombre del animal:</label><br> 
        <input type="text" placeholder="Ejemplo: Maximiliano"><br><br> 

        <label>Especie:</label><br> 
        <select> 
          <opcion>Perro</opcion> 
          <opcion>Gato</opcion> 
          <opcion>Otro</opcion> 
        </select><br><br> 

        <label>Edad:</label><br> 
        <input type="number" placeholder="Ejemplo: 5"><br><br> 

        <label>Estado de salud:</label><br> 
        <input type="text" placeholder="Ejemplo: Sano"><br><br> 

        <button type="submit">Guardar Animal</button> 
      </form> 
    </main> 
  </body> 
</html>
